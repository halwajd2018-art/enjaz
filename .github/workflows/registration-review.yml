name: Registration review tests (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - main.py
      - app.js
      - style.css
      - tests/**
      - .github/workflows/registration-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: |
          node --check app.js
          python -m py_compile main.py
          python -m py_compile tests/test_registration.py
      - name: Run tests using isolated SQLite DB and mocked SMTP / LiveKit
        run: |
          mkdir -p /tmp/enjaz-registration-check/app/static
          cp main.py __init__.py /tmp/enjaz-registration-check/app/
          cp index.html app.js style.css /tmp/enjaz-registration-check/app/static/
          PYTHONPATH=/tmp/enjaz-registration-check python -m unittest discover -s tests -p 'test_*.py' -v
