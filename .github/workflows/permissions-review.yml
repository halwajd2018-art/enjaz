name: Permissions review tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'main.py'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/permissions-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: |
          node --check app.js
          python -m py_compile main.py
          python -m py_compile tests/test_permissions.py
      - name: Run isolated unit and authorization tests (no real DB or video keys)
        run: |
          mkdir -p /tmp/enjaz-review/app
          cp main.py __init__.py /tmp/enjaz-review/app/
          PYTHONPATH=/tmp/enjaz-review python -m unittest discover -s tests -p 'test_*.py' -v
